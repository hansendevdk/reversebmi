<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Compare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">
  <h1 class="text-3xl font-bold mb-6">BMI Comparison</h1>

  <div class="w-full max-w-5xl mx-auto grid grid-cols-3 grid-rows-2 gap-8 items-start" style="min-height: 600px;">
    <!-- Top left result -->
    <div id="result-top-left"></div>
    <!-- Centered form -->
    <form id="bmi-form" class="flex flex-col gap-4 items-center w-full max-w-sm mx-auto">
      <div class="flex justify-center w-full">
        <label class="flex items-center cursor-pointer">
          <span class="mr-2">Metric</span>
          <input type="checkbox" id="unit-toggle" class="hidden peer">
          <span class="w-10 h-5 bg-gray-700 rounded-full relative transition peer-checked:bg-blue-600">
            <span class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full transition peer-checked:translate-x-5"></span>
          </span>
          <span class="ml-2">Imperial</span>
        </label>
      </div>
      <div class="flex items-center gap-2">
        <div id="height-metric">
          <select id="height-metric-select" class="w-48 p-2 rounded bg-gray-800 text-white text-center"></select>
        </div>
        <div id="height-imperial" class="flex gap-2 hidden">
          <select id="height-feet" class="w-32 p-2 rounded bg-gray-800 text-white text-center"></select>
          <select id="height-inches" class="w-32 p-2 rounded bg-gray-800 text-white text-center"></select>
        </div>
      </div>
      <input type="number" id="weight" placeholder="Weight in kilograms" class="w-48 p-2 rounded bg-gray-800 text-white text-center" required>
      <input
        type="number"
        id="bodyfat"
        placeholder="Bodyfat % (optional)"
        class="w-48 p-2 rounded bg-gray-800 text-white text-center"
        min="2"
        max="70"
        step="0.1"
      />
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 p-2 rounded w-48">Calculate</button>
      <p class="text-xs text-gray-400 mt-2 w-48 text-center">
        Disclaimer: All values are estimates based on public data and formulas. Individual results may vary. This tool is for informational purposes only and not a substitute for professional medical advice.
      </p>
    </form>
    <!-- Top right result -->
    <div id="result-top-right"></div>
    <!-- Bottom left result -->
    <div id="result-bottom-left"></div>
    <!-- Bottom center result -->
    <div id="result-bottom-center"></div>
    <!-- Bottom right result -->
    <div id="result-bottom-right"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
