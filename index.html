<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="See how much weight you'd need to gain or lose to match famous movie physiques, using reverse BMI.">
  <title>BMI Comparison</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">
  <h1 class="text-3xl font-bold mb-6">BMI Comparison</h1>

  <div class="w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 md:grid-rows-2 gap-8 items-start md:min-h-[600px]">
    <!-- Top left result -->
    <div id="result-top-left" class="order-2 md:order-none"></div>
    <!-- Centered form -->
    <form id="bmi-form" class="order-1 md:order-none flex flex-col gap-4 items-center w-full max-w-sm mx-auto">
      <div class="flex justify-center w-full">
        <label class="flex items-center cursor-pointer">
          <span id="unit-label-metric" class="mr-2 text-white font-medium transition-colors">Metric</span>
          <input type="checkbox" id="unit-toggle" class="sr-only peer">
          <span class="w-10 h-5 bg-gray-700 rounded-full relative transition peer-checked:bg-blue-600 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-500 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-gray-900">
            <span id="toggle-thumb" class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full transition-transform"></span>
          </span>
          <span id="unit-label-imperial" class="ml-2 text-gray-500 transition-colors">Imperial</span>
        </label>
      </div>
      <div class="flex items-center gap-2">
        <div id="height-metric">
          <select id="height-metric-select" class="w-48 p-2 rounded bg-gray-800 text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div id="height-imperial" class="flex gap-2 hidden">
          <select id="height-feet" class="w-32 p-2 rounded bg-gray-800 text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
          <select id="height-inches" class="w-32 p-2 rounded bg-gray-800 text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
      </div>
      <input
        type="number"
        id="weight"
        placeholder="Weight in kg"
        class="w-48 p-2 rounded bg-gray-800 text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500"
        min="20"
        max="300"
        step="0.1"
        required
      >
      <input
        type="number"
        id="bodyfat"
        placeholder="Bodyfat % (optional)"
        class="w-48 p-2 rounded bg-gray-800 text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500"
        min="2"
        max="70"
        step="0.1"
      />
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 p-2 rounded w-48 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900">Compare</button>
    </form>
    <!-- Top right result -->
    <div id="result-top-right" class="order-3 md:order-none"></div>
    <!-- Bottom left result -->
    <div id="result-bottom-left" class="order-4 md:order-none"></div>
    <!-- Bottom center result -->
    <div id="result-bottom-center" class="order-5 md:order-none"></div>
    <!-- Bottom right result -->
    <div id="result-bottom-right" class="order-6 md:order-none"></div>
  </div>

  <footer class="text-xs text-gray-500 text-center max-w-md mx-auto mt-8">
    Disclaimer: All values are estimates based on public data and formulas. Individual results may vary. This tool is for informational purposes only and not a substitute for professional medical advice.
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
